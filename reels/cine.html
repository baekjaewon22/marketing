<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>SEVEN STARS Cine</title>
<style>
@font-face{font-family:'Pretendard';font-weight:400;src:local('Pretendard'),url('../assets/fonts/Pretendard-Regular.ttf') format('truetype')}
@font-face{font-family:'Pretendard';font-weight:700;src:local('Pretendard Bold'),url('../assets/fonts/Pretendard-Bold.ttf') format('truetype')}
@font-face{font-family:'Pretendard';font-weight:800;src:local('Pretendard ExtraBold'),url('../assets/fonts/Pretendard-ExtraBold.ttf') format('truetype')}
@font-face{font-family:'Pretendard';font-weight:900;src:local('Pretendard Black'),url('../assets/fonts/Pretendard-Black.ttf') format('truetype')}

*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'Pretendard',sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.shot{position:absolute;inset:0;display:none;overflow:hidden}
.cam{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.cam img{position:absolute;top:0;left:0;width:1080px;height:1920px;object-fit:cover}
.cam .dof,.cam .face{-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#exposure,#flash,#leak,#vignette,#grain,#curtain,#ctabg{position:absolute;top:0;left:0;width:1080px;height:1920px;pointer-events:none}
#exposure{z-index:40;background:#000;opacity:0}
#ctabg{z-index:45;opacity:0;background:linear-gradient(180deg,rgba(8,6,10,.55),rgba(8,6,10,.78))}
#leak{z-index:60;opacity:0;mix-blend-mode:screen;background:radial-gradient(ellipse 70% 50% at 30% 40%,rgba(255,170,90,.9) 0%,rgba(0,0,0,0) 70%)}
#vignette{z-index:61;background:radial-gradient(ellipse 90% 72% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#grain{z-index:62;opacity:.16;mix-blend-mode:overlay}
#flash{z-index:70;background:#fff;opacity:0}
#curtain{z-index:99;background:#000;opacity:1}

/* 글자: 브이로그 자막처럼. 카메라와 따로 고정 */
#ui{position:absolute;inset:0;z-index:80}
.cap{position:absolute;left:40px;right:40px;top:1170px;text-align:center;opacity:0}
/* 자막 뒤 은은한 어둠 띠(사진이 밝아도 글자가 또렷하게) */
.cap::before{content:'';position:absolute;left:-40px;right:-40px;top:-90px;bottom:-90px;z-index:-1;
  background:radial-gradient(ellipse 62% 50% at 50% 50%,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 100%)}
.cap .ln{display:block;white-space:nowrap;font-size:84px;font-weight:900;line-height:1.22;letter-spacing:-3px}
/* 글자마다 따로 올라옴. 외곽 그림자 여러 겹으로 윤곽을 세운다 */
.cap .ch{display:inline-block;white-space:pre;opacity:0;will-change:transform,opacity;
  text-shadow:0 0 2px rgba(0,0,0,.7),0 3px 6px rgba(0,0,0,.55),0 8px 28px rgba(0,0,0,.55)}
/* 강조어: 금색 글자 + 아래로 쓸고 지나가는 형광펜 바 */
.cap .hl{position:relative;display:inline-block;color:#F5D08A;margin:0 14px}
.cap .hl .bar{position:absolute;left:-8px;right:-8px;bottom:-4px;height:18px;border-radius:6px;z-index:-1;
  background:linear-gradient(90deg,rgba(232,170,80,.85),rgba(245,208,138,.75));transform-origin:0 50%;transform:scaleX(0)}
.hook{position:absolute;left:60px;right:60px;top:300px;text-align:center}
.hook .h{font-size:92px;font-weight:900;line-height:1.16;letter-spacing:-3px;text-shadow:0 4px 26px rgba(0,0,0,.6)}
.hook .h .w{display:inline-block;opacity:0;white-space:pre}
.hook .s{margin-top:26px;font-size:50px;font-weight:700;opacity:0;text-shadow:0 3px 18px rgba(0,0,0,.6)}
.stamp{position:absolute;left:70px;top:190px;font-size:34px;font-weight:700;letter-spacing:4px;opacity:0;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.stamp i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#ff4a3d;margin-right:14px;vertical-align:4px}
.mark{position:absolute;right:66px;top:196px;font-size:26px;font-weight:400;letter-spacing:8px;opacity:.55}
.cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 60px}
.cta>*{opacity:0}
.cta .brand{font-size:44px;letter-spacing:14px;color:#E8C27A;margin-bottom:22px}
.cta .t{font-size:98px;font-weight:900;line-height:1.14;letter-spacing:-2px;text-align:center;margin-bottom:60px}
.cta .btn{border-radius:64px;padding:32px 90px;background:#E8C27A;color:#1a1208;font-size:60px;font-weight:900;margin-bottom:40px;
  box-shadow:0 12px 56px rgba(232,194,122,.35)}
.cta .sub{font-size:44px;font-weight:600;margin-bottom:24px}
.cta .foot{font-size:34px;color:#E8C27A;opacity:.75}
</style>
</head>
<body>
<div id="stage">
  <div id="exposure"></div><div id="ctabg"></div><div id="leak"></div><div id="vignette"></div><div id="grain"></div>
  <div id="ui"></div><div id="flash"></div><div id="curtain"></div>
</div>
<script>
/* 시네 쇼츠 렌더러. INPUT: window.SCRIPT(format:"cine"), window.FACTS, window.BPM_IN
   OUTPUT(render.js가 읽음): TOTAL, T_ON(컷 시작 시각 + 마지막 cta), STEP(가장 짧은 컷), SFX_ON(효과음 시각, 마지막은 cta), seekTo, qa, ready
   - 컷 길이는 박자 단위(첫 컷 2.6초↑, 자막 컷 2.0초↑, 자막 없는 컷 1.3초↑), 컷은 박 위에서 바뀐다
   - 카메라 움직임·흔들림·노출 떨림은 24fps로 끊어 계산해 실제 촬영본 같은 질감
   - 사진마다 흐린 판 두 장(render.js가 ffmpeg로 미리 만듦): dof(초점 밖 배경), face(얼굴 가우시안). 브라우저 blur는 프레임마다 느려서 쓰지 않는다 */
const IMG_BASE = '../assets/images/sevenstars/';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/&lt;br\s*\/?&gt;|\n/gi, '<br>');
const clamp01 = x => Math.max(0, Math.min(1, x));
const eIOS = t => -(Math.cos(Math.PI * t) - 1) / 2;
const eOC = t => 1 - Math.pow(1 - t, 3);
const eOB = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

const stage = document.getElementById('stage'), ui = document.getElementById('ui');
let S, F, SHOTS = [], N, BEAT, T_ON = [], DUR = [], TOTAL, CTA_AT, SFX_ON = [], CAPS = [], HOOK, STAMPS = [], CTA_ELS = [];

const MOVES = {
  push:     p => ({ s: 1.10 + .12 * p, x: 0, y: 0 }),
  pull:     p => ({ s: 1.24 - .12 * p, x: 0, y: 0 }),
  'pan-l':  p => ({ s: 1.16, x: 60 - 120 * p, y: 0 }),
  'pan-r':  p => ({ s: 1.16, x: -60 + 120 * p, y: 0 }),
  'tilt-up':p => ({ s: 1.16, x: 0, y: 80 - 160 * p }),
  handheld: p => ({ s: 1.13 + .02 * p, x: 0, y: 0 }),
  rack:     p => ({ s: 1.13 + .03 * p, x: 0, y: 0 }),
};

function faceMask(faces) {
  // faces: [[x,y,w,h]] (0~1 비율). 머리카락 가장자리까지 덮도록 키우고 가장자리를 부드럽게(가우시안처럼 번지게)
  return faces.map(([x, y, w, h]) => {
    const cx = (x + w / 2) * 1080, cy = (y + h / 2) * 1920, rx = w * 1080 * .85, ry = h * 1920 * .9;
    return `radial-gradient(ellipse ${rx.toFixed(0)}px ${ry.toFixed(0)}px at ${cx.toFixed(0)}px ${cy.toFixed(0)}px,#000 58%,rgba(0,0,0,0) 100%)`;
  }).join(',');
}
function dofMask(fx, fy, r) {
  return `radial-gradient(ellipse ${(r * .8).toFixed(0)}px ${r.toFixed(0)}px at ${(fx * 1080).toFixed(0)}px ${(fy * 1920).toFixed(0)}px,rgba(0,0,0,0) 40%,#000 100%)`;
}

/* 자막 한 줄 → 글자 span. *강조* 로 감싼 말은 강조어, 없으면 숫자 표현(1분, 70~80%, 10분, 1:1)을 자동 강조 */
function typeset(line) {
  let parts = String(line).split('*');
  if (parts.length < 3) {
    const m = String(line).match(/\d+\s?:\s?\d+|\d[\d~.,%]*\s?(분|시간|시|명|호|%)?/);
    parts = m ? [line.slice(0, m.index), m[0], line.slice(m.index + m[0].length)] : [line];
  }
  let n = 0;
  return parts.map((part, k) => {
    const chars = Array.from(part).map(ch => `<span class="ch">${esc(ch)}</span>`).join('');
    n += Array.from(part).length;
    return k % 2 && part ? `<span class="hl" data-last="${n - 1}">${chars}<span class="bar"></span></span>` : chars;
  }).join('');
}

function build() {
  S.shots.forEach((sh, i) => {
    const d = document.createElement('div');
    d.className = 'shot';
    const faces = (sh.faces || []).filter(f => f && f.length === 4);
    d.innerHTML = `<div class="cam"><img class="sharp" data-src="${esc(sh.photo)}">` +
      (sh.blur ? `<img class="dof" data-src="${esc(sh.blur.dof)}" style="opacity:0">` : '') +
      (sh.blur && faces.length ? `<img class="face" data-src="${esc(sh.blur.face)}" style="-webkit-mask-image:${faceMask(faces)};mask-image:${faceMask(faces)}">` : '') +
      `</div>`;
    stage.insertBefore(d, document.getElementById('exposure'));
    const r = rng(1000 + i * 77);
    SHOTS.push({ el: d, cam: d.querySelector('.cam'), dof: d.querySelector('.dof'), sh,
      move: MOVES[sh.motion] || MOVES.handheld, ph: [r() * 6.28, r() * 6.28, r() * 6.28, r() * 6.28],
      focus: sh.focus || [.5, .55] });
    if (sh.text) {
      const c = document.createElement('div'); c.className = 'cap';
      c.innerHTML = String(sh.text).split(/<br\s*\/?>|\n/i).map(l => `<span class="ln">${typeset(l)}</span>`).join('');
      ui.appendChild(c);
      CAPS.push({ el: c, i, chars: Array.from(c.querySelectorAll('.ch')),
        hls: Array.from(c.querySelectorAll('.hl')).map(h => ({ el: h, bar: h.querySelector('.bar'), last: +h.dataset.last })) });
    }
    if (sh.stamp) { const s = document.createElement('div'); s.className = 'stamp'; s.innerHTML = `<i></i>${esc(sh.stamp)}`; ui.appendChild(s); STAMPS.push({ el: s, i }); }
  });
  const mk = document.createElement('div'); mk.className = 'mark'; mk.textContent = F.brand; ui.appendChild(mk);
  // 훅: 첫 컷 위 큰 문장, 단어 단위로 튀어나옴
  const h = document.createElement('div'); h.className = 'hook';
  const words = String(S.hook.text).split(/(<br\s*\/?>|\n)/i).flatMap(part => /^(<br\s*\/?>|\n)$/i.test(part) ? ['\n'] : part.split(/(?<= )/));
  h.innerHTML = `<div class="h">${words.map(w => w === '\n' ? '<br>' : `<span class="w">${esc(w)}</span>`).join('')}</div>` +
    (S.hook.sub ? `<div class="s">${esc(S.hook.sub)}</div>` : '');
  ui.appendChild(h);
  HOOK = { words: Array.from(h.querySelectorAll('.w')), sub: h.querySelector('.s') };
  // cta
  const c = document.createElement('div'); c.className = 'cta';
  const t = S.cta || {};
  c.innerHTML = `<div class="brand">${esc(F.brand)}</div><div class="t">${esc(t.title || '이번 주말<br>합정에서 만나요')}</div>` +
    `<div class="btn">${esc(F.url)}</div><div class="sub">${esc(t.sub || F.cta_path)}</div>` +
    `<div class="foot">${esc(t.foot || `${F.location.short} · ${F.schedule.short}`)}</div>`;
  ui.appendChild(c);
  CTA_ELS = Array.from(c.children);
}

function setTempo(bpm) {
  BEAT = 60000 / bpm;
  const snap = ms => Math.ceil(ms / BEAT) * BEAT;
  let t = 0;
  S.shots.forEach((sh, i) => {
    const need = sh.hold ? sh.hold * 1000 : i === 0 ? 2600 : sh.text ? 2000 + Math.max(0, String(sh.text).length - 12) * 45 : 1300;
    T_ON.push(t); DUR.push(snap(need)); t += DUR[i];
  });
  CTA_AT = t;
  const ctaLen = snap(3800) + Math.ceil(1400 / BEAT) * BEAT;
  TOTAL = CTA_AT + ctaLen;
  SFX_ON = S.shots.map((sh, i) => i > 0 && ['whip', 'flash'].includes(sh.cut) ? T_ON[i] : null).filter(x => x !== null);
  SFX_ON.push(CTA_AT);
  Object.assign(window, { TOTAL, BEAT, T_ON: [...T_ON, CTA_AT], STEP: Math.min(...DUR), SFX_ON });
}

/* 손에 든 카메라: 서로 안 맞는 주기의 사인 합(매 프레임 재현 가능) */
function shake(t, ph, amt) {
  const s = t / 1000;
  return {
    x: amt * (6 * Math.sin(6.283 * .9 * s + ph[0]) + 3 * Math.sin(6.283 * 2.3 * s + ph[1]) + 1.2 * Math.sin(6.283 * 5.1 * s + ph[2])),
    y: amt * (5 * Math.sin(6.283 * .7 * s + ph[1]) + 2.5 * Math.sin(6.283 * 1.9 * s + ph[3]) + 1 * Math.sin(6.283 * 4.3 * s + ph[0])),
    r: amt * .28 * Math.sin(6.283 * .5 * s + ph[2]),
  };
}

const curtain = document.getElementById('curtain'), flash = document.getElementById('flash'), leak = document.getElementById('leak'),
  grain = document.getElementById('grain'), expo = document.getElementById('exposure'), ctabg = document.getElementById('ctabg');
window.seekTo = function (ms) {
  const t = Math.min(Math.max(0, ms), TOTAL);
  const tq = Math.floor(t / (1000 / 24)) * (1000 / 24); // 24fps 카메라 질감
  curtain.style.opacity = (1 - eIOS(clamp01(t / 450))).toFixed(4) * 1 + (t > TOTAL - 900 ? clamp01((t - (TOTAL - 900)) / 900) : 0);
  let cur = SHOTS.length - 1;
  for (let i = 0; i < SHOTS.length; i++) if (t >= T_ON[i] && t < T_ON[i] + DUR[i]) { cur = i; break; }
  let flashA = 0, leakA = 0;
  SHOTS.forEach((o, i) => {
    const a = T_ON[i], b = i === SHOTS.length - 1 ? TOTAL : a + DUR[i];
    const nextCut = (SHOTS[i + 1] || {}).sh ? SHOTS[i + 1].sh.cut : null;
    // 휩: 나가는 컷은 끝 130ms, 들어오는 컷은 처음 130ms 동안 크게 밀리며 흐려진다
    const whipOut = nextCut === 'whip' && t >= b - 130 && t < b, whipIn = o.sh.cut === 'whip' && i > 0 && t >= a && t < a + 130;
    const visible = (t >= a && t < b) || whipOut;
    if (!visible) { o.el.style.display = 'none'; return; }
    o.el.style.display = 'block';
    const p = clamp01((tq - a) / (b - a));
    const m = o.move(eIOS(p)), k = shake(tq, o.ph, o.sh.motion === 'handheld' ? 1.4 : .8);
    let wx = 0;
    if (whipOut) wx = -900 * Math.pow((t - (b - 130)) / 130, 2);
    if (whipIn) wx = 900 * Math.pow(1 - (t - a) / 130, 2);
    o.cam.style.transform = `translate(${(m.x + k.x + wx).toFixed(2)}px,${(m.y + k.y).toFixed(2)}px) rotate(${k.r.toFixed(3)}deg) scale(${m.s.toFixed(4)})`;
    if (o.dof) {
      const [fx, fy] = o.focus;
      if (whipOut || whipIn) { o.dof.style.opacity = 1; o.dof.style.maskImage = o.dof.style.webkitMaskImage = 'none'; }
      else if (o.sh.motion === 'rack') {
        // 랙 포커스: 처음엔 전체가 흐리고, 0.25~0.95초 사이 초점 영역이 열린다
        const q = eIOS(clamp01((t - a - 250) / 700)), r = 40 + q * 1000;
        o.dof.style.opacity = 1; o.dof.style.maskImage = o.dof.style.webkitMaskImage = dofMask(fx, fy, r);
      } else if (o.sh.focus) { o.dof.style.opacity = .85; o.dof.style.maskImage = o.dof.style.webkitMaskImage = dofMask(fx, fy, 1040); }
      else o.dof.style.opacity = 0;
    }
    if (i > 0 && o.sh.cut === 'flash') { const d = t - a; flashA = Math.max(flashA, d < 0 ? 0 : Math.exp(-d / 70) * .9); }
    if (i > 0 && o.sh.cut === 'flash') { const d = t - a; leakA = Math.max(leakA, Math.exp(-(d * d) / (2 * 220 * 220))); }
  });
  // 딥: 검게 잠깐
  let dip = 0;
  SHOTS.forEach((o, i) => { if (i > 0 && o.sh.cut === 'dip') { const d = Math.abs(t - T_ON[i]); dip = Math.max(dip, clamp01(1 - d / 220)); } });
  flash.style.opacity = flashA.toFixed(3);
  leak.style.opacity = (leakA * .6).toFixed(3);
  // 노출 떨림(캔들·실내조명) + 딥
  const fl = .035 + .025 * Math.sin(tq * .0461) * Math.sin(tq * .0043 + 1.3);
  expo.style.opacity = Math.max(fl, dip).toFixed(3);
  const gf = Math.floor(t / (1000 / 24)); grain.style.backgroundPosition = `${(gf * 73) % 256}px ${(gf * 151) % 256}px`;

  // 자막: 컷 시작 +120ms에 올라오고 컷 끝 직전에 사라짐
  // 글자가 하나씩 아래에서 튀어 오르며(작게 시작해 제자리로) 나타나고, 강조어는 형광펜 바가 쓸고 지나간 뒤 한 번 툭 커진다.
  // 컷 끝 200ms 동안 위로 빠지며 사라짐
  CAPS.forEach(({ el, i, chars, hls }) => {
    const a = T_ON[i] + 100, end = T_ON[i] + DUR[i] - 40, step = Math.min(38, 520 / Math.max(1, chars.length));
    if (t < a || t >= end) { el.style.opacity = 0; return; }
    const out = clamp01((t - (end - 200)) / 200);
    el.style.opacity = (1 - out).toFixed(3);
    el.style.transform = `translateY(${(-eIOS(out) * 36).toFixed(1)}px)`;
    chars.forEach((c, j) => {
      const p = clamp01((t - a - j * step) / 300);
      c.style.opacity = Math.min(1, p * 2.5).toFixed(3);
      c.style.transform = `translateY(${((1 - eOB(p)) * 48).toFixed(1)}px) scale(${(.7 + .3 * eOB(p)).toFixed(4)})`;
    });
    hls.forEach(h => {
      const s0 = a + h.last * step + 220, q = clamp01((t - s0) / 280), k = clamp01((t - s0 - 200) / 260);
      h.bar.style.transform = `scaleX(${eOC(q).toFixed(4)})`;
      h.el.style.transform = `scale(${(1 + .08 * Math.sin(Math.PI * k)).toFixed(4)})`;
    });
  });
  STAMPS.forEach(({ el, i }) => { el.style.opacity = t >= T_ON[i] && t < T_ON[i] + DUR[i] ? .9 : 0; });
  // 훅: 첫 컷에서 단어별로 튀어나오고, 다음 컷으로 넘어가면 사라짐
  const hookEnd = DUR[0] - 80;
  HOOK.words.forEach((w, j) => {
    const p = clamp01((t - 300 - j * 110) / 320);
    w.style.opacity = t < hookEnd ? Math.min(1, p * 2).toFixed(3) : 0;
    w.style.transform = `scale(${t < hookEnd ? eOB(p).toFixed(4) : 1})`;
  });
  if (HOOK.sub) { const p = clamp01((t - 300 - HOOK.words.length * 110 - 150) / 400); HOOK.sub.style.opacity = t < hookEnd ? eOC(p).toFixed(3) : 0; }
  // cta: 마지막 컷 위에 어두운 막 + 글자 순서대로
  const cp = clamp01((t - CTA_AT) / 500);
  ctabg.style.opacity = eIOS(cp).toFixed(3);
  const last = SHOTS[SHOTS.length - 1];
  if (t >= CTA_AT && last.dof) { last.dof.style.opacity = eIOS(cp).toFixed(3); last.dof.style.maskImage = last.dof.style.webkitMaskImage = 'none'; }
  CTA_ELS.forEach((el, j) => {
    const p = clamp01((t - CTA_AT - 250 - j * 280) / 420);
    el.style.opacity = eOC(p).toFixed(3);
    el.style.transform = j === 2 ? `scale(${p > 0 ? eOB(p).toFixed(4) : 0})` : `translateY(${((1 - eOC(p)) * 40).toFixed(1)}px)`;
  });
  // cta 동안 자막·도장 숨김
  if (t >= CTA_AT) { CAPS.forEach(c => c.el.style.opacity = 0); STAMPS.forEach(s => s.el.style.opacity = 0); }
};

window.qa = function () {
  const out = [];
  const check = (el, at, label) => {
    window.seekTo(at);
    const r = el.getBoundingClientRect();
    if (r.width && (r.left < 30 || r.right > 1050 || r.top < 150 || r.bottom > 1700)) out.push({ slide: label, text: el.textContent.trim().slice(0, 40), rect: [r.left | 0, r.top | 0, r.right | 0, r.bottom | 0] });
  };
  CAPS.forEach(({ el, i }) => el.querySelectorAll('.ln').forEach(s => check(s, T_ON[i] + DUR[i] - 300, i)));
  check(document.querySelector('.hook .h'), DUR[0] - 300, 0);
  CTA_ELS.forEach(el => check(el, TOTAL - 300, 'cta'));
  window.seekTo(0);
  return out;
};

function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), img = g.createImageData(256, 256), r = rng(1337);
  for (let i = 0; i < img.data.length; i += 4) { const v = 110 + r() * 145; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  grain.style.backgroundImage = `url(${c.toDataURL()})`;
}

async function boot() {
  const Q = new URLSearchParams(location.search);
  S = window.SCRIPT || await (await fetch(Q.get('script'))).json();
  F = window.FACTS || await (await fetch('brand-facts.json')).json();
  build();
  const imgs = Array.from(document.querySelectorAll('.cam img'));
  imgs.forEach(img => { img.src = IMG_BASE + img.dataset.src; });
  await Promise.all(imgs.map(img => img.decode().catch(() => {})));
  await document.fonts.ready;
  // 자막이 너무 길면 글자를 줄인다
  CAPS.forEach(({ el }) => el.querySelectorAll('.ln').forEach(s => {
    let fs = 84; const w = () => { s.style.width = 'max-content'; const x = s.offsetWidth; s.style.width = ''; return x; };
    while (w() > 980 && fs > 48) { fs -= 2; s.style.fontSize = fs + 'px'; }
  }));
  const hh = document.querySelector('.hook .h'); let hs = 92; while (hh.scrollWidth > 960 && hs > 60) { hs -= 3; hh.style.fontSize = hs + 'px'; }
  makeGrain();
  setTempo(parseFloat(window.BPM_IN || Q.get('bpm')) || 100);
  window.seekTo(0);
  return true;
}
window.ready = boot();
</script>
